<!doctype html>
<!--
  製図ツール(seizu-tool)
  Excel感覚で使える2Dの製図ツール。このHTMLファイル1つで動き、インターネットにはつながない。
    画面の部品 … このHTMLの body(上から順に: ツールバー → 復元の案内 → 作図の画面 → 数値入力 → 状態表示)
    見た目     … head の style(元は www/styles.css)
    動き       … ページの最後の JavaScript(元は src/*.js。npm run build で作る)
  dist/seizu.html(圧縮版)と dist/seizu.readable.html(非圧縮版)は、JavaScript を圧縮したかどうかだけが違う。
  画面の部品の id(例: canvas、numpanel)は、JavaScript がその部品を見つけるための名前。
-->
<html lang="ja">
<head>
<!-- 文字コード(日本語を正しく表示するため)と、狭い画面での表示の幅 -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- ブラウザのタブに出る題名(保存していない変更があると、先頭に * が付く) -->
<title>製図ツール</title>
<!-- 見た目の指定。配布ファイルでは、この場所に中身(色・並べ方)がそのまま埋め込まれている -->
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- ===== ツールバー(画面の上): 1段目はタブと共通ボタン、2段目はタブごとの道具 ===== -->
<header id="toolbar">
  <!-- 1段目: タブ(押すと2段目の道具が切り替わる)と、いつも使うボタン -->
  <div id="topbar">
    <nav id="tabs" role="tablist">
      <button class="tab" data-tab="file" role="tab">ファイル</button>
      <button class="tab active" data-tab="draw" role="tab">作図</button>
      <button class="tab" data-tab="annotate" role="tab">寸法・記号</button>
      <button class="tab" data-tab="edit" role="tab">編集</button>
      <button class="tab" data-tab="view" role="tab">表示・設定</button>
    </nav>
    <!-- いつも使うボタン: 元に戻す・やり直し・拡大・縮小・全体表示・ヘルプ -->
    <div class="group quick">
      <button id="undo" title="元に戻す (Ctrl+Z)&#10;直前の操作を取り消す">元に戻す</button>
      <button id="redo" title="やり直し (Ctrl+Y)&#10;取り消した操作をもう一度行う">やり直し</button>
      <button id="zoom-in" title="拡大&#10;画面の中央を大きく表示（Shift+マウスホイールでも拡大・縮小）">＋</button>
      <button id="zoom-out" title="縮小&#10;画面の中央を小さく表示">－</button>
      <button id="zoom-fit" title="全体&#10;用紙全体が見えるように表示">全体</button>
      <button id="help-open" class="help-button" title="ヘルプ (F1)&#10;使い方の説明を開く。ツールを使っている時はそのツールの説明を開く">？ ヘルプ</button>
    </div>
  </div>
  <!-- 2段目(リボン): 左端の「選択」、選んだタブの道具(panel)、右端の線種・太さ・文字 -->
  <div id="ribbon">
    <!-- いつも左端にある「選択」の道具(図形を選ぶ・動かす・つまみで形を変える) -->
    <div class="group fixed">
      <button class="tool active" data-tool="select">選択</button>
    </div>
    <!-- 「ファイル」タブ: 新規・開く・保存・名前を付けて保存 / SVG出力・印刷 -->
    <div class="panel" data-panel="file">
      <div class="group">
        <button id="file-new" title="新規&#10;新しい白紙の図面を始める">新規</button>
        <button id="file-open" title="開く (Ctrl+O)&#10;保存した図面ファイル(.json)を開く。ファイルを画面に落としても開ける">開く</button>
        <button id="file-save" title="保存 (Ctrl+S)&#10;図面をファイルに保存する">保存</button>
        <button id="file-saveas" title="名前を付けて保存 (Ctrl+Shift+S)&#10;別の名前・場所に保存する">名前を付けて保存</button>
      </div>
      <div class="group">
        <button id="export-svg" title="SVG出力&#10;図面を画像ファイル(SVG)として書き出す。印刷しない線は含まれない">SVG出力</button>
        <button id="print" title="印刷&#10;印刷画面を開く。倍率は100%(実際のサイズ)を選ぶと実寸で印刷。「PDFに保存」でPDFにもできる">印刷</button>
      </div>
    </div>
    <!-- 「作図」タブ: 直線〜文字の作図 / 正多角形(右の欄は角の数) / ねじ穴(右のメニューはねじの太さ) -->
    <div class="panel active" data-panel="draw">
      <div class="group">
        <button class="tool" data-tool="line">直線</button>
        <button class="tool" data-tool="polyline">連続線</button>
        <button class="tool" data-tool="rect">矩形</button>
        <button class="tool" data-tool="circle">円</button>
        <button class="tool" data-tool="arc">円弧</button>
        <button class="tool" data-tool="ellipse">楕円</button>
        <button class="tool" data-tool="earc">楕円弧</button>
        <button class="tool" data-tool="spline">スプライン</button>
        <button class="tool" data-tool="text">文字</button>
      </div>
      <div class="group">
        <button class="tool" data-tool="polygon">正多角形</button>
        <label title="角の数（3〜64）。6なら六角形、8なら八角形"><input id="polygon-sides" size="2" value="6">角</label>
      </div>
      <div class="group">
        <button class="tool" data-tool="thread">ねじ穴</button>
        <select id="thread-size" title="ねじの太さ(呼び)。M6なら直径6mmのねじ">
          <option>M3</option><option>M4</option><option>M5</option>
          <option selected>M6</option><option>M8</option><option>M10</option><option>M12</option>
        </select>
      </div>
    </div>
    <!-- 「寸法・記号」タブ: 寸法・φ・R・角度・C・引出線 / 粗さ・公差枠 / ハッチ(斜線の角度・間隔) / バルーン・部品表 -->
    <div class="panel" data-panel="annotate">
      <div class="group">
        <button class="tool" data-tool="dim">寸法</button>
        <button class="tool" data-tool="dia">φ</button>
        <button class="tool" data-tool="rad">R</button>
        <button class="tool" data-tool="angle">角度</button>
        <button class="tool" data-tool="chamfer">C</button>
        <button class="tool" data-tool="leader">引出線</button>
      </div>
      <div class="group">
        <button class="tool" data-tool="roughness">粗さ</button>
        <button class="tool" data-tool="fcf">公差枠</button>
      </div>
      <div class="group">
        <button class="tool" data-tool="hatch">ハッチ</button>
        <label title="斜線の角度(°)">角度<input id="hatch-angle" size="3" value="45"></label>
        <label title="斜線の間隔(印刷した紙の上でのmm)">間隔<input id="hatch-space" size="3" value="3"></label>
      </div>
      <div class="group">
        <button class="tool" data-tool="balloon">バルーン</button>
        <button class="tool" data-tool="bom">部品表</button>
      </div>
    </div>
    <!-- 「編集」タブ: 回転・拡大縮小(右の欄に角度・倍率) / 反転・分解・グループ化 / トリム・延長 / オフセット / フィレット・面取り -->
    <div class="panel" data-panel="edit">
      <div class="group">
        <button id="rotate" title="回転&#10;選んだ図形を、右の角度だけ回す（＋は左回り、－は右回り）">回転</button>
        <label title="回す角度(°)。＋で左回り、－で右回り"><input id="rotate-angle" size="4" value="90">°</label>
        <button id="scale" title="拡大縮小&#10;選んだ図形を、右の倍率で大きく・小さくする（2なら2倍、0.5なら半分）">拡大縮小</button>
        <label title="倍率。2で2倍、0.5で半分"><input id="scale-factor" size="4" value="2">倍</label>
      </div>
      <div class="group">
        <button id="mirror-x" title="左右反転&#10;選んだ図形を左右さかさまにする">左右反転</button>
        <button id="mirror-y" title="上下反転&#10;選んだ図形を上下さかさまにする">上下反転</button>
        <button id="explode" title="分解&#10;選んだ四角形・連続線・正多角形をバラバラの直線にする（トリムや角を丸める前に使う）。ねじ穴やグループは別々の図形に分ける">分解</button>
        <button id="group" title="グループ化&#10;選んだ2つ以上の図形を1つのまとまりにする。どれか1つをクリックすると全体が選ばれ、まとめて動かせる（「分解」で解除）">グループ化</button>
      </div>
      <div class="group">
        <button class="tool" data-tool="trim">トリム</button>
        <button class="tool" data-tool="extend">延長</button>
      </div>
      <div class="group">
        <button class="tool" data-tool="offset">オフセット</button>
        <label title="コピーを離す距離(mm)">距離<input id="offset-dist" size="4" value="10"></label>
      </div>
      <div class="group">
        <button class="tool" data-tool="fillet">フィレット</button>
        <button class="tool" data-tool="chamferEdit">面取り</button>
        <label title="角を丸める半径 / 切り落とす大きさ(mm)">サイズ<input id="fillet-r" size="4" value="5"></label>
      </div>
    </div>
    <!-- 「表示・設定」タブ: 用紙・縮尺 / 方眼とスナップ / 投影ガイド・45°線 / 原点・レイヤー・線種の間隔・操作ガイド -->
    <div class="panel" data-panel="view">
      <div class="group">
        <label title="用紙の大きさ">用紙 <select id="paper-size">
          <option>A2</option><option>A3</option><option selected>A4</option>
          <option>B3</option><option>B4</option><option>B5</option>
        </select></label>
        <label title="用紙の向き"><select id="paper-orientation">
          <option value="landscape" selected>横</option>
          <option value="portrait">縦</option>
        </select></label>
        <label title="縮尺。1:2なら実物の半分の大きさで紙に描く。寸法の値は実物の大きさのまま">縮尺 <input id="scale-input" size="6" value="1:1"></label>
      </div>
      <div class="group">
        <label title="方眼(グリッド)の間隔。自動は拡大・縮小に合わせて変わる">グリッド <select id="grid-mode">
          <option value="auto" selected>自動</option>
          <option value="manual">手動</option>
        </select></label>
        <select id="grid-step" disabled title="手動のときの方眼の間隔(mm)">
          <option>10</option><option>5</option><option>2</option>
          <option selected>1</option><option>0.5</option><option>0.1</option>
        </select>
        <label title="クリックした位置を方眼の交点にぴったり合わせる"><input type="checkbox" id="grid-snap" checked>スナップ</label>
        <label title="図形の端・真ん中・中心・交わる所にぴったり合わせる"><input type="checkbox" id="osnap" checked>点スナップ</label>
      </div>
      <div class="group">
        <label title="選んだ図形から縦横の補助の点線を伸ばし、正面図・平面図・側面図の位置をそろえる"><input type="checkbox" id="proj-guides" checked>投影ガイド</label>
        <button class="tool" data-tool="mirror45">45°線配置</button>
        <label title="45°線を表示する"><input type="checkbox" id="show45" checked>45°線</label>
      </div>
      <div class="group">
        <button class="tool" data-tool="origin">原点設定</button>
        <details id="layer-panel">
          <summary title="線の種類ごとに、画面に表示するか・印刷するかを切り替える">レイヤー</summary>
          <div id="layer-list"></div>
        </details>
        <details id="dash-panel">
          <summary title="かくれ線（破線）・中心線（一点鎖線）・想像線（二点鎖線）の、線の長さと隙間を変える。図面ごとに保存され、印刷にも使われる">線種の間隔</summary>
          <div id="dash-list"></div>
        </details>
        <label title="マウスの横に「次に何をクリックするか」と長さなどを表示する"><input type="checkbox" id="show-guide" checked>操作ガイド</label>
      </div>
    </div>
    <!-- いつも右端にある線種・線の太さ・文字の大きさのメニュー(図形を選んでいればその図形を、作図中なら次に描く図形を変える) -->
    <div class="group style">
      <label title="線種(線の見た目)。図形を選んでいる時はその図形を変更、作図ツールの時は次に描く線に使う&#10;外形線=太い実線 / かくれ線=破線 / 中心線=一点鎖線 / 想像線=二点鎖線 / 細実線=細い線 / 補助線=印刷しない下書き線">線種 <select id="line-style">
        <option value="outline" selected>外形線</option>
        <option value="hidden">かくれ線</option>
        <option value="center">中心線</option>
        <option value="phantom">想像線</option>
        <option value="thinline">細実線</option>
        <option value="aux">補助線</option>
      </select></label>
      <label title="線の太さ(印刷した紙の上でのmm)。図形を選んでいる時はその図形を変更、作図ツールの時は次に描く図形に使う。標準=線種どおり(外形線0.5/かくれ線0.35/その他0.25)">太さ <select id="line-width"></select></label>
      <label title="文字の高さ(印刷した紙の上でのmm)。文字・寸法・記号・部品表を選んでいる時はその大きさを変更、文字・寸法ツールの時は次に作る文字に使う">文字 <select id="text-size"></select></label>
    </div>
  </div>
</header>
<!-- ===== 復元の案内: 前回、保存しないまま閉じたときだけ出る黄色い帯 ===== -->
<div id="restore-banner">
  <span>前回、未保存の変更が残ったまま終了したようです。復元しますか?</span>
  <button id="restore-yes">復元する</button>
  <button id="restore-no">破棄する</button>
</div>
<!-- ===== 作図の画面: 図面を描くキャンバスと、その上に重ねて出す部品 ===== -->
<main id="canvas-wrap">
  <!-- 用紙・図形・寸法を描く画面(マウスの操作もここで受け取る) -->
  <canvas id="canvas"></canvas>
  <!-- 文字・引出線・寸法の値を打ち込むときに、図面の上に出る白い入力欄 -->
  <input id="text-entry" placeholder="文字を入力してEnter">
  <!-- マウスの横に出る操作ガイド(次にすること・長さなどの値) -->
  <div id="cursor-tip" hidden></div>
  <!-- 画面の下と右のスクロールバー(つまみをドラッグ、空いた所をクリックでその位置へ) -->
  <div id="hscroll"><div id="hthumb"></div></div>
  <div id="vscroll"><div id="vthumb"></div></div>
</main>
<!-- ===== 数値入力: 数字で描く・選んだ図形を数字で直す欄(中身は道具や選んだ図形で変わる) ===== -->
<section id="numpanel">
  <span id="np-title">数値入力:</span>
  <span id="np-fields"></span>
  <button id="num-draw">作図</button>
  <span class="hint">Escで中止 / 右クリックでメニュー / 寸法値・表題欄・部品表のマスはダブルクリックで記入 / 困ったら F1 でヘルプ</span>
</section>
<!-- ===== 状態表示: マウスの位置・方眼の間隔・縮尺・表示倍率・図形の数・案内 ===== -->
<footer id="statusbar">&nbsp;</footer>
<!-- 動きの部分。配布ファイルでは、この場所に JavaScript の中身がそのまま埋め込まれている -->
<script src="app.js" defer></script>
</body>
</html>
