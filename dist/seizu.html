<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>製図ツール</title>
<style>
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  display: flex; flex-direction: column;
  font-family: "Yu Gothic UI", "Meiryo", sans-serif; font-size: 13px;
  background: #2b2e33; color: #ddd;
}
#toolbar { background: #1e2126; border-bottom: 1px solid #000; }
#topbar {
  display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px;
  padding: 4px 10px 0; background: #16181c;
}
#tabs { display: flex; gap: 2px; }
.tab {
  border-radius: 5px 5px 0 0; border-bottom: none; padding: 5px 16px;
  background: #2a2e34; color: #aab;
}
.tab.active { background: #1e2126; color: #fff; border-color: #555; font-weight: bold; }
#topbar .quick { padding-bottom: 4px; }
#ribbon {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  padding: 6px 10px; min-height: 40px;
}
#ribbon .panel { display: none; flex-wrap: wrap; gap: 10px; align-items: center; }
#ribbon .panel.active { display: flex; }
#toolbar .group { display: flex; gap: 4px; align-items: center; }
#ribbon .panel .group + .group { border-left: 1px solid #444; padding-left: 10px; }
#ribbon .group.fixed { border-right: 1px solid #444; padding-right: 10px; }
#ribbon .group.style { margin-left: auto; border-left: 1px solid #444; padding-left: 10px; }
button { background: #3a3f46; color: #ddd; border: 1px solid #555; border-radius: 3px; padding: 3px 10px; cursor: pointer; }
button:hover { background: #4a5058; }
button.tool.active { background: #0b6bcb; border-color: #0b6bcb; color: #fff; }
.help-button { background: #2f6b3f; border-color: #3f8a52; color: #fff; font-weight: bold; }
.help-button:hover { background: #3a8250; }
#toolbar label { display: inline-flex; gap: 3px; align-items: center; }
select, input { background: #23262b; color: #ddd; border: 1px solid #555; border-radius: 3px; padding: 2px 4px; }
input:disabled, select:disabled { opacity: 0.4; }
#layer-panel { position: relative; }
#layer-panel summary { cursor: pointer; padding: 3px 8px; background: #3a3f46; border: 1px solid #555; border-radius: 3px; list-style: none; }
#layer-list {
  position: absolute; right: 0; top: 100%; z-index: 20; min-width: 200px;
  background: #23262b; border: 1px solid #555; border-radius: 3px; padding: 6px 10px;
  display: grid; grid-template-columns: auto auto auto; gap: 4px 12px; align-items: center;
}
#layer-list .head { color: #889; font-size: 11px; }
#restore-banner {
  display: none; gap: 10px; align-items: center;
  padding: 6px 10px; background: #6b5300; color: #ffe9a8;
  border-bottom: 1px solid #000;
}
#canvas-wrap { flex: 1; min-height: 0; position: relative; }
#hscroll, #vscroll {
  position: absolute; z-index: 6; background: rgba(20, 22, 26, 0.55);
}
#hscroll { left: 0; right: 14px; bottom: 0; height: 13px; }
#vscroll { top: 0; bottom: 14px; right: 0; width: 13px; }
#hthumb, #vthumb {
  position: absolute; background: #5f6a76; border-radius: 5px; cursor: grab;
}
#hthumb { top: 2px; height: 9px; min-width: 24px; }
#vthumb { left: 2px; width: 9px; min-height: 24px; }
#hthumb:hover, #vthumb:hover { background: #8494a5; }
#text-entry {
  position: absolute; display: none; z-index: 5; min-width: 160px;
  background: #fff; color: #111; border: 2px solid #0b6bcb;
}
#canvas { width: 100%; height: 100%; display: block; cursor: crosshair; }
#numpanel {
  display: flex; gap: 8px; align-items: center;
  padding: 5px 10px; background: #1e2126; border-top: 1px solid #000;
}
#np-fields { display: flex; gap: 8px; align-items: center; }
#np-fields label { display: flex; gap: 4px; align-items: center; white-space: nowrap; }
#numpanel .hint { color: #888; margin-left: auto; }
#statusbar { padding: 4px 10px; background: #14161a; color: #9ab; font-family: Consolas, monospace; }

/* カーソル横の操作ガイド */
#cursor-tip {
  position: absolute; z-index: 7; pointer-events: none; white-space: nowrap;
  padding: 3px 8px; border-radius: 4px; font-size: 12px; line-height: 1.5;
  background: rgba(20, 24, 30, 0.88); color: #fff; border: 1px solid #0b6bcb;
}
#cursor-tip .values { color: #9fd0ff; font-family: Consolas, monospace; }

/* 右クリックメニュー */
.popup-menu {
  position: fixed; z-index: 50; min-width: 200px; padding: 4px 0;
  background: #262a30; border: 1px solid #555; border-radius: 5px;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45); color: #e4e4e4; font-size: 13px;
}
.popup-menu .item {
  display: grid; grid-template-columns: 18px 1fr auto; gap: 6px; align-items: center;
  padding: 5px 12px 5px 8px; cursor: default; white-space: nowrap;
}
.popup-menu .item:hover { background: #0b6bcb; color: #fff; }
.popup-menu .item.disabled { color: #777; }
.popup-menu .item.disabled:hover { background: transparent; color: #777; }
.popup-menu .key { color: #9aa; font-size: 11px; padding-left: 16px; }
.popup-menu .item:hover .key { color: #dde; }
.popup-menu .sep { height: 1px; margin: 4px 0; background: #444; }

/* ヘルプ(明るい配色で読みやすく) */
#help {
  position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center;
  background: rgba(0, 0, 0, 0.45);
}
.help-window {
  display: flex; flex-direction: column; width: min(1100px, 94vw); height: min(820px, 92vh);
  background: #fff; color: #222; border-radius: 8px; overflow: hidden;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); font-size: 15px;
}
.help-window header {
  display: flex; gap: 12px; align-items: center; padding: 10px 16px;
  background: #f1f4f8; border-bottom: 1px solid #d8dee6;
}
.help-window header h2 { margin: 0; font-size: 18px; white-space: nowrap; }
.help-window header input {
  flex: 1; min-width: 120px; padding: 6px 10px; font-size: 15px;
  background: #fff; color: #222; border: 1px solid #b8c2ce; border-radius: 4px;
}
.help-window header button { background: #fff; color: #333; border-color: #b8c2ce; padding: 5px 12px; }
.help-window header button:hover { background: #e7ecf2; }
.help-body { display: flex; flex: 1; min-height: 0; }
.help-toc {
  width: 280px; flex-shrink: 0; overflow-y: auto; padding: 8px 0;
  background: #f8fafc; border-right: 1px solid #e1e6ec; font-size: 14px;
}
.help-toc h4 { margin: 12px 14px 4px; font-size: 12px; color: #6b7785; }
.help-toc a { display: block; padding: 5px 14px 5px 20px; color: #234; text-decoration: none; }
.help-toc a:hover { background: #e8f1fb; }
.help-toc a.current { background: #0b6bcb; color: #fff; }
.help-toc .empty { padding: 12px 16px; color: #777; }
.help-article { flex: 1; overflow-y: auto; padding: 18px 28px 40px; line-height: 1.8; }
.help-article h1 { font-size: 22px; margin: 0 0 12px; padding-bottom: 6px; border-bottom: 2px solid #0b6bcb; }
.help-article h3 { font-size: 17px; margin: 22px 0 6px; color: #0b4f96; }
.help-article a { color: #0b6bcb; }
.help-steps { padding-left: 1.6em; }
.help-steps li { margin: 4px 0; }
.help-figure { margin: 14px 0; padding: 10px; background: #fbfcfe; border: 1px solid #e1e6ec; border-radius: 6px; text-align: center; }
.help-figure svg { max-width: 100%; height: auto; }
.help-figure figcaption { font-size: 13px; color: #555; margin-top: 4px; }
.help-tip, .help-note { margin: 12px 0; padding: 8px 12px; border-radius: 5px; }
.help-tip { background: #eaf6ec; border-left: 4px solid #3f8a52; }
.help-note { background: #fff4e0; border-left: 4px solid #e8900c; }
.help-article kbd {
  display: inline-block; padding: 0 6px; font-family: Consolas, monospace; font-size: 13px;
  background: #f3f3f3; border: 1px solid #bbb; border-bottom-width: 2px; border-radius: 3px;
}
.help-btn {
  display: inline-block; padding: 0 8px; font-size: 13px; line-height: 1.6;
  background: #3a3f46; color: #eee; border: 1px solid #555; border-radius: 3px;
}
.help-article table { border-collapse: collapse; margin: 10px 0; }
.help-article th, .help-article td { border: 1px solid #d5dbe3; padding: 4px 10px; text-align: left; }
.help-article th { background: #f1f4f8; }
@media (max-width: 700px) {
  .help-body { flex-direction: column; }
  .help-toc { width: auto; max-height: 30%; border-right: none; border-bottom: 1px solid #e1e6ec; }
}

</style>
</head>
<body>
<header id="toolbar">
  <div id="topbar">
    <nav id="tabs" role="tablist">
      <button class="tab" data-tab="file" role="tab">ファイル</button>
      <button class="tab active" data-tab="draw" role="tab">作図</button>
      <button class="tab" data-tab="annotate" role="tab">寸法・記号</button>
      <button class="tab" data-tab="edit" role="tab">編集</button>
      <button class="tab" data-tab="view" role="tab">表示・設定</button>
    </nav>
    <div class="group quick">
      <button id="undo" title="元に戻す (Ctrl+Z)&#10;直前の操作を取り消す">元に戻す</button>
      <button id="redo" title="やり直し (Ctrl+Y)&#10;取り消した操作をもう一度行う">やり直し</button>
      <button id="zoom-in" title="拡大&#10;画面の中央を大きく表示（Shift+マウスホイールでも拡大・縮小）">＋</button>
      <button id="zoom-out" title="縮小&#10;画面の中央を小さく表示">－</button>
      <button id="zoom-fit" title="全体&#10;用紙全体が見えるように表示">全体</button>
      <button id="help-open" class="help-button" title="ヘルプ (F1)&#10;使い方の説明を開く。ツールを使っている時はそのツールの説明を開く">？ ヘルプ</button>
    </div>
  </div>
  <div id="ribbon">
    <div class="group fixed">
      <button class="tool active" data-tool="select">選択</button>
    </div>
    <div class="panel" data-panel="file">
      <div class="group">
        <button id="file-new" title="新規&#10;新しい白紙の図面を始める">新規</button>
        <button id="file-open" title="開く (Ctrl+O)&#10;保存した図面ファイル(.json)を開く。ファイルを画面に落としても開ける">開く</button>
        <button id="file-save" title="保存 (Ctrl+S)&#10;図面をファイルに保存する">保存</button>
        <button id="file-saveas" title="名前を付けて保存 (Ctrl+Shift+S)&#10;別の名前・場所に保存する">名前を付けて保存</button>
      </div>
      <div class="group">
        <button id="export-svg" title="SVG出力&#10;図面を画像ファイル(SVG)として書き出す。印刷しない線は含まれない">SVG出力</button>
        <button id="print" title="印刷&#10;印刷画面を開く。倍率は100%(実際のサイズ)を選ぶと実寸で印刷。「PDFに保存」でPDFにもできる">印刷</button>
      </div>
    </div>
    <div class="panel active" data-panel="draw">
      <div class="group">
        <button class="tool" data-tool="line">直線</button>
        <button class="tool" data-tool="polyline">連続線</button>
        <button class="tool" data-tool="rect">矩形</button>
        <button class="tool" data-tool="circle">円</button>
        <button class="tool" data-tool="arc">円弧</button>
        <button class="tool" data-tool="ellipse">楕円</button>
        <button class="tool" data-tool="earc">楕円弧</button>
        <button class="tool" data-tool="spline">スプライン</button>
        <button class="tool" data-tool="text">文字</button>
      </div>
      <div class="group">
        <button class="tool" data-tool="thread">ねじ穴</button>
        <select id="thread-size" title="ねじの太さ(呼び)。M6なら直径6mmのねじ">
          <option>M3</option><option>M4</option><option>M5</option>
          <option selected>M6</option><option>M8</option><option>M10</option><option>M12</option>
        </select>
      </div>
    </div>
    <div class="panel" data-panel="annotate">
      <div class="group">
        <button class="tool" data-tool="dim">寸法</button>
        <button class="tool" data-tool="dia">φ</button>
        <button class="tool" data-tool="rad">R</button>
        <button class="tool" data-tool="angle">角度</button>
        <button class="tool" data-tool="chamfer">C</button>
        <button class="tool" data-tool="leader">引出線</button>
      </div>
      <div class="group">
        <button class="tool" data-tool="roughness">粗さ</button>
        <button class="tool" data-tool="fcf">公差枠</button>
      </div>
      <div class="group">
        <button class="tool" data-tool="hatch">ハッチ</button>
        <label title="斜線の角度(°)">角度<input id="hatch-angle" size="3" value="45"></label>
        <label title="斜線の間隔(印刷した紙の上でのmm)">間隔<input id="hatch-space" size="3" value="3"></label>
      </div>
      <div class="group">
        <button class="tool" data-tool="balloon">バルーン</button>
        <button class="tool" data-tool="bom">部品表</button>
      </div>
    </div>
    <div class="panel" data-panel="edit">
      <div class="group">
        <button id="rotate" title="回転&#10;選んだ図形を、右の角度だけ回す（＋は左回り、－は右回り）">回転</button>
        <label title="回す角度(°)。＋で左回り、－で右回り"><input id="rotate-angle" size="4" value="90">°</label>
        <button id="scale" title="拡大縮小&#10;選んだ図形を、右の倍率で大きく・小さくする（2なら2倍、0.5なら半分）">拡大縮小</button>
        <label title="倍率。2で2倍、0.5で半分"><input id="scale-factor" size="4" value="2">倍</label>
      </div>
      <div class="group">
        <button id="mirror-x" title="左右反転&#10;選んだ図形を左右さかさまにする">左右反転</button>
        <button id="mirror-y" title="上下反転&#10;選んだ図形を上下さかさまにする">上下反転</button>
        <button id="explode" title="分解&#10;選んだ四角形・連続線をバラバラの直線にする（トリムや角を丸める前に使う）">分解</button>
      </div>
      <div class="group">
        <button class="tool" data-tool="trim">トリム</button>
        <button class="tool" data-tool="extend">延長</button>
      </div>
      <div class="group">
        <button class="tool" data-tool="offset">オフセット</button>
        <label title="コピーを離す距離(mm)">距離<input id="offset-dist" size="4" value="10"></label>
      </div>
      <div class="group">
        <button class="tool" data-tool="fillet">フィレット</button>
        <button class="tool" data-tool="chamferEdit">面取り</button>
        <label title="角を丸める半径 / 切り落とす大きさ(mm)">サイズ<input id="fillet-r" size="4" value="5"></label>
      </div>
    </div>
    <div class="panel" data-panel="view">
      <div class="group">
        <label title="用紙の大きさ">用紙 <select id="paper-size">
          <option>A2</option><option selected>A3</option><option>A4</option>
          <option>B3</option><option>B4</option><option>B5</option>
        </select></label>
        <label title="用紙の向き"><select id="paper-orientation">
          <option value="landscape" selected>横</option>
          <option value="portrait">縦</option>
        </select></label>
        <label title="縮尺。1:2なら実物の半分の大きさで紙に描く。寸法の値は実物の大きさのまま">縮尺 <input id="scale-input" size="6" value="1:1"></label>
      </div>
      <div class="group">
        <label title="方眼(グリッド)の間隔。自動は拡大・縮小に合わせて変わる">グリッド <select id="grid-mode">
          <option value="auto" selected>自動</option>
          <option value="manual">手動</option>
        </select></label>
        <select id="grid-step" disabled title="手動のときの方眼の間隔(mm)">
          <option>10</option><option>5</option><option>2</option>
          <option selected>1</option><option>0.5</option><option>0.1</option>
        </select>
        <label title="クリックした位置を方眼の交点にぴったり合わせる"><input type="checkbox" id="grid-snap" checked>スナップ</label>
        <label title="図形の端・真ん中・中心・交わる所にぴったり合わせる"><input type="checkbox" id="osnap" checked>点スナップ</label>
      </div>
      <div class="group">
        <label title="選んだ図形から縦横の補助の点線を伸ばし、正面図・平面図・側面図の位置をそろえる"><input type="checkbox" id="proj-guides" checked>投影ガイド</label>
        <button class="tool" data-tool="mirror45">45°線配置</button>
        <label title="45°線を表示する"><input type="checkbox" id="show45" checked>45°線</label>
      </div>
      <div class="group">
        <button class="tool" data-tool="origin">原点設定</button>
        <details id="layer-panel">
          <summary title="線の種類ごとに、画面に表示するか・印刷するかを切り替える">レイヤー</summary>
          <div id="layer-list"></div>
        </details>
        <label title="マウスの横に「次に何をクリックするか」と長さなどを表示する"><input type="checkbox" id="show-guide" checked>操作ガイド</label>
      </div>
    </div>
    <div class="group style">
      <label title="線種(線の見た目)。図形を選んでいる時はその図形を変更、作図ツールの時は次に描く線に使う&#10;外形線=太い実線 / かくれ線=破線 / 中心線=一点鎖線 / 想像線=二点鎖線 / 細実線=細い線 / 補助線=印刷しない下書き線">線種 <select id="line-style">
        <option value="outline" selected>外形線</option>
        <option value="hidden">かくれ線</option>
        <option value="center">中心線</option>
        <option value="phantom">想像線</option>
        <option value="thinline">細実線</option>
        <option value="aux">補助線</option>
      </select></label>
      <label title="線の太さ(印刷した紙の上でのmm)。図形を選んでいる時はその図形を変更、作図ツールの時は次に描く図形に使う。標準=線種どおり(外形線0.5/かくれ線0.35/その他0.25)">太さ <select id="line-width"></select></label>
      <label title="文字の高さ(印刷した紙の上でのmm)。文字・寸法・記号・部品表を選んでいる時はその大きさを変更、文字・寸法ツールの時は次に作る文字に使う">文字 <select id="text-size"></select></label>
    </div>
  </div>
</header>
<div id="restore-banner">
  <span>前回、未保存の変更が残ったまま終了したようです。復元しますか?</span>
  <button id="restore-yes">復元する</button>
  <button id="restore-no">破棄する</button>
</div>
<main id="canvas-wrap">
  <canvas id="canvas"></canvas>
  <input id="text-entry" placeholder="文字を入力してEnter">
  <div id="cursor-tip" hidden></div>
  <div id="hscroll"><div id="hthumb"></div></div>
  <div id="vscroll"><div id="vthumb"></div></div>
</main>
<section id="numpanel">
  <span id="np-title">数値入力:</span>
  <span id="np-fields"></span>
  <button id="num-draw">作図</button>
  <span class="hint">Escで中止 / 右クリックでメニュー / 寸法値・表題欄・部品表のマスはダブルクリックで記入 / 困ったら F1 でヘルプ</span>
</section>
